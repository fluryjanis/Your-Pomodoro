name: 'Dependency Compliance Scan'
on: 
  pull_request:
  workflow_dispatch: # This adds the magical "Run workflow" button!

permissions:
  contents: read

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    steps:
      - name: 'Checkout Repository'
        uses: actions/checkout@v6

      - name: 'Scan for License Violations'
        uses: actions/dependency-review-action@v5
